<!DOCTYPE html>
<html>
<head>
    <title>COMPROG - HTML</title>
</head>
<body bgcolor="#393914">
    <font face="Arial">

    
    <marquee behavior="alternate" direction="left" scrollamount="5" width="90%">
        <u><font color="white">COMPROG - HTML</font></u>
    </marquee>
    <hr>

    <center>
        <p><font color="red">LACAÑA JOHN CEDRICK C. </font></p>
    </center>
    <hr>

    <p align="right"><font color="#00ffff">THIS IS RIGHT</font></p>
    <hr>

    <center><font color="yellow">THIS IS CENTER</font></center>
    <hr>

    <marquee direction="up" scrollamount="3" height="50">
        <font color="#b39ddb">THIS GOES <sup>UP</sup></font>
    </marquee>
    <hr>

    <marquee direction="down" scrollamount="3" height="50">
        <font color="#f8bbd0">THIS GOES <sub>DOWN</sub></font>
    </marquee>
    <hr>

    <marquee direction="right" scrollamount="6">
        <font color="orange">THIS GOES TO THE RIGHT</font>
    </marquee>
    <hr>

    <marquee direction="left" scrollamount="6">
        <font color="white">THIS GOES TO THE LEFT</font>
    </marquee>
    <hr>

    </font>
</body>
</html>
